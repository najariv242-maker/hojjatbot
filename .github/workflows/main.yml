name: Run HojjatBot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # اجرای خودکار هر ۶ ساعت یک‌بار
    - cron: '0 */6 * * *'

permissions:
  contents: write
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 psmisc
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Bot Script (5.5 Hours Cycle)
        env:
          # اگر متغیرهای محیطی (Secrets) دارید، نام آن‌ها را اینجا قرار دهید:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          chmod +x run_workflow.sh
          ./run_workflow.sh

      - name: Save Database & Self Re-Trigger
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ذخیره دیتابیس در مخزن قبل از پایان سیکل
          if [ -f "consulting_bot.db" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add consulting_bot.db
            git commit -m "Auto-backup database [skip ci]" || true
            git push origin main || true
          fi
          # راه‌اندازی مجدد خودکار سیکل بعدی
          gh workflow run main.yml --ref main || true
